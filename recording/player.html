<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Foundry workshop recordings</title>
  <style>
    body{margin:24px auto;padding:0 20px;max-width:1280px;background:#101827;color:#eef3ff;font:18px/1.5 system-ui,sans-serif}
    h1{font-size:28px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
    button{font:inherit;padding:10px 18px;cursor:pointer;border:1px solid #a6bde7;border-radius:8px}
    button[aria-pressed=true]{background:#3474bd;color:white}video{width:100%;max-height:75vh;background:black}
    #status{min-height:30px}#status[role=alert]{color:#ffb1b1}small{color:#c2cee1}
    #chapters{margin:14px 0}select{font:inherit;max-width:100%;padding:7px}
  </style>
</head>
<body>
  <p><a id="english" href="?lang=en" lang="en">English</a> | <a id="korean" href="?lang=ko" lang="ko">한국어</a></p>
  <h1 data-text="heading">Sweden Central · Follow the guide in order</h1>
  <p data-text="introduction">Loading the verified recording date, language, and scope.</p>
  <nav aria-label="Choose a video"></nav>
  <section id="chapters" aria-label="Lab chapters" hidden>
    <label for="chapter-select" data-text="chapter">Jump to a lab</label>
    <select id="chapter-select" aria-label="Jump to a lab"></select>
  </section>
  <p id="status" role="status" data-text="loading">Checking the local video catalog.</p>
  <video controls preload="metadata" aria-label="Workshop recording player"></video>
  <p><small data-text="footer">Local files only. No Azure calls, sign-in, or external uploads.
    Seek with the playback bar or change speed using the player's menu.</small></p>
  <script>
    const parameters = new URLSearchParams(location.search);
    const requestedLanguage = parameters.get("lang");
    const language = requestedLanguage === "ko" ? "ko" : "en";
    const translations = {
      en: {
        title: "Foundry workshop recordings",
        heading: "Sweden Central · Follow the guide in order",
        introduction: "Loading the verified recording date, language, and scope.",
        englishIntroduction: "English guide and UI recordings with unchanged Korean synthetic policy inputs. Actual CLI/portal calls, local document views, and historical evaluation reports are distinct. No new provisioning or deployment.",
        koreanIntroduction: "Original Korean-content recordings. The combined video follows Lab 00–11; individual videos are also available. Footage stays at original speed and chapter cards are identified separately.",
        chapter: "Jump to a lab", chapters: "Lab chapters", choose: "Choose a video",
        loading: "Checking the local video catalog.", player: "Workshop recording player",
        footer: "Local files only. No Azure calls, sign-in, or external uploads. Seek with the playback bar or change speed using the player's menu.",
        playbackError: "Playback failed. Check the terminal error and local MP4 file. Error code: ",
        timeError: "The requested start time is outside the recording.",
        chapterError: "The selected lab chapter was not found.",
        catalogError: "Video catalog request failed: HTTP ",
        invalidTime: "Invalid start time: ", invalidVideo: "Unknown video: ",
        edited: "Waits removed · ",
        videos: {"guide-walkthrough.mp4": "Guide-ordered walkthrough · Korean source", "cli-edited.mp4": "CLI execution · Korean source", "portal-edited.mp4": "Foundry portal · Korean source"},
        englishVideos: {"guide-walkthrough.mp4": "English guide-ordered walkthrough", "cli-edited.mp4": "Actual CLI execution · English guide", "portal-edited.mp4": "Foundry portal · English UI"},
        labs: ["Getting started", "Foundry and projects", "Models", "First agent", "MAF tools and MCP", "MAF workflows", "Search and Foundry IQ", "Evaluation", "Hosted Agent", "Operations and cleanup", "IQ extensions", "Capstone"]
      },
      ko: {
        title: "Foundry 실습 녹화 재생",
        heading: "Sweden Central · 실습 가이드 순서대로 따라보기",
        introduction: "검증된 촬영일·언어·실행 범위를 불러오는 중입니다.",
        englishIntroduction: "영문 가이드·UI 촬영본이며 한국어 합성 정책 입력은 유지합니다. 실제 CLI·포털 호출, 로컬 문서 화면, 과거 평가 보고서를 구분합니다. 새 리소스 생성·배포는 하지 않았습니다.",
        koreanIntroduction: "한국어 원본 촬영본입니다. 통합본은 Lab 00–11 순서이며, 개별 영상도 선택할 수 있습니다. 장면은 원래 속도이고 통합본의 제목 화면은 별도로 표시했습니다.",
        chapter: "이동할 실습", chapters: "실습 챕터", choose: "영상 선택",
        loading: "로컬 영상 목록을 확인하고 있습니다.", player: "실습 녹화 플레이어",
        footer: "로컬 파일만 재생합니다. Azure 호출·로그인·외부 업로드는 하지 않습니다. 재생 막대를 움직여 원하는 위치로 이동하거나 플레이어 메뉴에서 재생 속도를 바꾸세요.",
        playbackError: "영상을 재생하지 못했습니다. 실행 터미널의 오류와 로컬 MP4 파일을 확인하세요. 오류 코드: ",
        timeError: "지정한 시작 시각이 영상 길이를 벗어납니다.",
        chapterError: "선택한 실습 챕터를 찾을 수 없습니다.",
        catalogError: "영상 목록 요청 실패: HTTP ",
        invalidTime: "유효하지 않은 시작 시각입니다: ", invalidVideo: "존재하지 않는 영상 이름입니다: ",
        edited: "대기 제거 편집본 · ",
        videos: {"guide-walkthrough.mp4": "실습 순서 통합본", "cli-edited.mp4": "CLI 핵심 실행", "portal-edited.mp4": "Foundry 포털 핵심 조작"},
        englishVideos: {"guide-walkthrough.mp4": "영문 가이드 순서 통합본", "cli-edited.mp4": "영문 가이드의 실제 CLI 실행", "portal-edited.mp4": "영문 UI의 Foundry 포털"},
        labs: ["시작과 공통 환경", "Foundry와 프로젝트", "모델", "첫 에이전트", "MAF 함수와 MCP", "MAF 워크플로", "Search와 Foundry IQ", "평가", "Hosted Agent", "운영과 정리", "IQ 확장", "캡스톤"]
      }
    };
    const text = translations[language];
    document.documentElement.lang = language;
    document.title = text.title;
    for (const element of document.querySelectorAll("[data-text]"))
      element.textContent = text[element.dataset.text];
    const player = document.querySelector("video");
    const status = document.querySelector("#status");
    const navigation = document.querySelector("nav");
    const chapterPanel = document.querySelector("#chapters");
    const chapterSelect = document.querySelector("#chapter-select");
    player.setAttribute("aria-label", text.player);
    navigation.setAttribute("aria-label", text.choose);
    chapterPanel.setAttribute("aria-label", text.chapters);
    chapterSelect.setAttribute("aria-label", text.chapter);
    document.querySelector(language === "en" ? "#english" : "#korean").setAttribute("aria-current", "true");
    let selectedVideo = null;
    let pendingSeek = 0;
    function updateLocation(video, seconds) {
      history.replaceState(null, "", "?lang=" + language + "&video=" + encodeURIComponent(video.filename) +
        (seconds ? "&t=" + seconds : ""));
    }
    for (const [id, lang] of [["english", "en"], ["korean", "ko"]])
      document.getElementById(id).addEventListener("click", event => {
        const query = new URLSearchParams({lang});
        if (selectedVideo) {
          query.set("video", selectedVideo.filename);
          query.set("t", String(player.currentTime));
        }
        event.currentTarget.href = "?" + query;
      });
    function updateChapter() {
      const chapters = selectedVideo?.chapters || [];
      const chapter = chapters.find(item =>
        item.start_seconds <= player.currentTime && player.currentTime < item.end_seconds);
      if (chapter) chapterSelect.value = chapter.id;
    }
    function fail(message) {
      status.setAttribute("role", "alert");
      status.textContent = message;
    }
    player.addEventListener("error", () => fail(
      text.playbackError + player.error?.code
    ));
    player.addEventListener("loadedmetadata", () => {
      if (pendingSeek >= player.duration) {
        fail(text.timeError);
        return;
      }
      player.currentTime = pendingSeek;
      chapterSelect.disabled = false;
      updateChapter();
    });
    player.addEventListener("timeupdate", updateChapter);
    chapterSelect.addEventListener("change", () => {
      const chapter = selectedVideo?.chapters?.find(item => item.id === chapterSelect.value);
      if (!chapter) {
        fail(text.chapterError);
        return;
      }
      player.currentTime = chapter.start_seconds;
      updateLocation(selectedVideo, chapter.start_seconds);
    });
    async function initialize() {
      if (requestedLanguage !== null && !["en", "ko"].includes(requestedLanguage))
        throw new Error("Unsupported language: " + requestedLanguage);
      const response = await fetch("/media.json", {cache:"no-store"});
      if (!response.ok) throw new Error(text.catalogError + response.status);
      const catalog = await response.json();
      const {videos, default_video, edition, recorded_on} = catalog;
      if (!["en", "ko"].includes(edition) || !/^\d{4}-\d{2}-\d{2}$/.test(recorded_on))
        throw new Error("The recording catalog has no valid edition or recording date.");
      document.querySelector('[data-text="introduction"]').textContent =
        recorded_on + " · " + (edition === "en" ? text.englishIntroduction : text.koreanIntroduction);
      const videoTitles = edition === "en" ? text.englishVideos : text.videos;
      const requested = parameters.get("video");
      const time = parameters.get("t");
      if (time !== null && (!/^\d+(?:\.\d+)?$/.test(time) || !Number.isFinite(Number(time))))
        throw new Error(text.invalidTime + time);
      const start = time === null ? 0 : Number(time);
      if (requested && !videos.some(video => video.filename === requested))
        throw new Error(text.invalidVideo + requested);
      function select(video, secondsFromStart = 0) {
        if (secondsFromStart >= video.duration_seconds)
          throw new Error(text.timeError);
        player.pause();
        selectedVideo = video;
        pendingSeek = secondsFromStart;
        chapterSelect.replaceChildren();
        chapterSelect.disabled = true;
        for (const chapter of video.chapters || []) {
          const option = document.createElement("option");
          option.value = chapter.id;
          const time = Math.floor(chapter.start_seconds);
          const title = Number.isInteger(chapter.lab) && text.labs[chapter.lab]
            ? `Lab ${String(chapter.lab).padStart(2, "0")}. ${text.labs[chapter.lab]}` : chapter.title;
          option.textContent = `${Math.floor(time / 60)}:${String(time % 60).padStart(2, "0")} · ${title}`;
          chapterSelect.append(option);
        }
        chapterPanel.hidden = !video.chapters?.length;
        player.src = "/video/" + encodeURIComponent(video.filename);
        status.setAttribute("role", "status");
        const seconds = Math.round(video.duration_seconds);
        status.textContent = `${video.edited ? text.edited : ""}${video.filename} · ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")} · ${(video.bytes / 1e6).toFixed(1)} MB`;
        for (const button of navigation.children)
          button.setAttribute("aria-pressed", String(button.dataset.filename === video.filename));
        updateLocation(video, secondsFromStart);
      }
      for (const video of videos) {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.filename = video.filename;
        button.textContent = videoTitles[video.filename] || video.title || video.filename;
        button.addEventListener("click", () => select(video));
        navigation.append(button);
      }
      const initial = videos.find(video => video.filename === (requested || default_video));
      if (!initial) throw new Error(text.invalidVideo + default_video);
      select(initial, start);
    }
    initialize().catch(error => fail(error.message));
  </script>
</body>
</html>
