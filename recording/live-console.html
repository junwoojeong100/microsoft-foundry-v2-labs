<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Foundry v2 — 실제 CLI 실행 기록</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e7eefb;font:18px/1.55 system-ui,-apple-system,sans-serif}
    header{padding:22px 40px;background:#13223d;border-bottom:1px solid #29415f}
    h1{font-size:28px;margin:0}header p{color:#adc7e8;margin:6px 0 0;font-size:16px}
    main{padding:24px 40px}section{margin:0 0 20px;background:#122036;border:1px solid #2a405e;border-radius:12px;padding:20px}
    h2{font-size:22px;margin:0 0 10px}#status{display:inline-block;padding:3px 12px;border-radius:20px;background:#30455f;margin-left:10px}
    #status.running{background:#6f4d0b}#status.completed{background:#135437}#status.failed{background:#842f38}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;font:17px/1.5 ui-monospace,SFMono-Regular,monospace;margin:0}
    #output{max-height:540px;overflow:auto}#command{color:#9bd8ff}#details{font-size:15px;color:#a7bfdd}
    #error{color:#ffb6be}footer{font-size:14px;color:#9dafc6}
  </style>
</head>
<body>
<header><h1>Microsoft Foundry v2 — 실제 CLI 실행 기록</h1><p>실습 스크립트의 실제 명령과 출력을 브라우저에 표시합니다. Foundry 포털을 모사한 화면이 아닙니다.</p></header>
<main>
  <section><h2><span id="stage">실습 준비</span><span id="status">대기</span></h2><pre id="command"></pre><p id="details">합성 데이터만 사용 · 개인 식별자/토큰 마스킹 · 실제 반환 코드 표시</p></section>
  <section><pre id="output">실행 기록을 기다리고 있습니다.</pre><p id="error"></p></section>
  <footer>이 화면의 결과는 scripts/record_lab_step.py가 실행한 실제 프로세스에서 수집됩니다. offline-fixture는 모델 실행과 구분합니다.</footer>
</main>
<script>
  let latest;
  async function refresh(){
    try{
      const response=await fetch('state.json',{cache:'no-store'});
      if(!response.ok) throw new Error('실행 기록 연결 상태: HTTP '+response.status);
      latest=await response.json();
      document.querySelector('#stage').textContent=latest.title;
      document.querySelector('#command').textContent=latest.command;
      document.querySelector('#status').textContent=latest.status;
      document.querySelector('#status').className=latest.status;
      document.querySelector('#output').textContent=latest.output||'실제 프로세스가 실행 중입니다. 응답을 기다립니다.';
      document.querySelector('#error').textContent='';
      const elapsed=latest.finished_at?latest.duration_seconds:Math.floor((Date.now()-Date.parse(latest.started_at))/1000);
      document.querySelector('#details').textContent='상태: '+latest.status+' · 경과: '+elapsed+'초 · 반환 코드: '+(latest.return_code??'실행 중')+' · 민감한 식별정보 가림';
    }catch(error){document.querySelector('#error').textContent=error.message;}
  }
  refresh();setInterval(refresh,1000);
</script>
</body>
</html>
