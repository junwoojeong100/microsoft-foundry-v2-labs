name: Workshop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/verify_workshop.py --label ci-quality
      - run: python scripts/workshop.py doctor
      - run: python scripts/workshop.py demo --label ci-offline --prompt v2
      - run: python scripts/workshop.py evaluate --label ci-offline
      - run: python scripts/package_hosted.py
  sdk-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.lock.txt -e ".[cloud,agents,hosted,dev]"
      - run: python -m pip check
      - run: python scripts/check_sdk.py
      - run: python -m unittest discover -s tests_sdk -t . -v
