[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microsoft-foundry-v2-labs"
version = "2026.9.13"
description = "A Korean Microsoft Foundry workshop with beginner and practitioner paths."
requires-python = ">=3.13,<3.15"
license = "MIT"
dependencies = []

[project.optional-dependencies]
cloud = [
  "azure-ai-projects==2.3.0",
  "azure-identity==1.25.3",
  "openai==2.54.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.3",
]
agents = [
  "microsoft-foundry-v2-labs[cloud]",
  "agent-framework-core==1.17.0",
  "agent-framework-foundry==1.12.0",
  "agent-framework-orchestrations==1.1.1",
  "mcp==1.27.2",
]
hosted = [
  "microsoft-foundry-v2-labs[agents]",
  "agent-framework-foundry-hosting==1.0.0b260903",
]
dev = ["ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
